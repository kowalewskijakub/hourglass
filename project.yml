name: Hourglass

options:
  bundleIdPrefix: com.hourglass
  deploymentTarget:
    macOS: "26.0"
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.44.0"

# Settings shared by every target.
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing so everything builds & runs locally with no developer team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

packages:
  HourglassCore:
    path: Packages/HourglassCore
  # Real-time sync (Supabase) — confirmed to compile against this SDK. Re-add the
  # `- package: Supabase` target deps below and wire Sync/SyncService once the
  # Supabase project credentials are in place. See Sync/SYNC.md.
  # Supabase:
  #   url: https://github.com/supabase/supabase-swift
  #   from: "2.0.0"

targets:
  # ---------- macOS: menu-bar / floating-window timer ----------
  Hourglass-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/macOS
      - path: Shared
    dependencies:
      - package: HourglassCore
        product: HourglassCore
      # - package: Supabase
      #   product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourglass.mac
        PRODUCT_NAME: Hourglass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Apps/macOS/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleName: Hourglass
    scheme:
      gatherCoverageData: true

  # ---------- iOS: full-screen timer + Live Activity ----------
  Hourglass-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOS
      - path: Shared
    dependencies:
      - package: HourglassCore
        product: HourglassCore
      # - package: Supabase
      #   product: Supabase
      - target: Hourglass-iOSWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourglass.ios
        PRODUCT_NAME: Hourglass
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleName: Hourglass
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      gatherCoverageData: true

  # ---------- iOS WidgetKit extension: Live Activity UI ----------
  Hourglass-iOSWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOSWidgets
      - path: Shared/SessionTint.swift
    dependencies:
      - package: HourglassCore
        product: HourglassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hourglass.ios.widgets
        PRODUCT_NAME: HourglassWidgets
    info:
      path: Apps/iOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hourglass
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
